name: Sync Fork with Upstream

on:
  schedule:
    # 每天 UTC 00:00（台灣時間 08:00）自動執行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub Actions 頁面手動點擊執行

permissions:
  contents: write

jobs:
  sync:
    name: Sync with upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git remote add upstream https://github.com/twjackysu/TWSEMCPServer.git || true
          git fetch upstream main

          UPSTREAM_REV=$(git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base HEAD upstream/main)

          echo "Upstream commit: $UPSTREAM_REV"
          echo "Current base:    $MERGE_BASE"

          if [ "$UPSTREAM_REV" = "$MERGE_BASE" ]; then
            echo "✅ 已經是最新版本，與 upstream 同步完畢，無需更新。"
            exit 0
          fi

          echo "🚀 偵測到 upstream 有新更新，開始進行合併..."
          git merge upstream/main --no-edit -m "ci: merge upstream/main into fork"
          git push origin main
          echo "🎉 成功同步並推送到 main 分支！"
